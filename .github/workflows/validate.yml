name: Validate driver and extension
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint:extension
      - run: node scripts/generate-api-docs.js --check
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: npm run check:compose
      - run: npm run build:extension
      - run: python3 scripts/verify-xpi.py artifacts/kasm-agent-unsigned.xpi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kasm-agent-unsigned
          path: artifacts/kasm-agent-unsigned.xpi
          if-no-files-found: error

