name: Kasm private ESR integration
on:
  push:
    branches: ['test/firefox-esr-private']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kasm-esr-smoke
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: bash scripts/run-esr-smoke.sh
