name: Recover AMO unlisted signed version
on:
  push:
    branches: ['sign/**']
    paths-ignore:
      - 'artifacts/kasm-agent-signed.xpi'
      - 'artifacts/signed-artifact.json'
permissions:
  contents: write
concurrency:
  group: amo-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: amo-signing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint:extension
      - run: node scripts/recover-signed.js
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - name: Commit verified signed XPI to signing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/kasm-agent-signed.xpi artifacts/signed-artifact.json
          git diff --cached --quiet || git commit -m "Release verified Mozilla-signed Firefox extension"
          git push origin HEAD:sign/amo-unlisted-20261123
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovered-amo-version
          path: |
            artifacts/kasm-agent-signed.xpi
            artifacts/signed-artifact.json
          retention-days: 5
          if-no-files-found: ignore
