name: Kasm signed Firefox Release integration
on:
  pull_request:
    branches: [main]
    paths:
      - artifacts/kasm-agent-signed.xpi
      - artifacts/signed-artifact.json
      - .github/workflows/signed-release-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kasm-signed-release-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify committed signed package and metadata against reviewed source
        run: python3 scripts/verify-xpi.py artifacts/kasm-agent-signed.xpi --require-signature --metadata artifacts/signed-artifact.json
      - name: Run signed Firefox Release on an isolated CI network
        env:
          SIGNED_RELEASE_SMOKE: '1'
        run: bash scripts/run-esr-smoke.sh
