services:
  chrome:
    image: kasmweb/chrome:1.18.0-rolling-weekly
    environment:
      - VNC_PW=${VNC_PW}
    ports:
      - "6901:6901"
    expose:
      - "6901"
    volumes:
      - kasm-profile:/home/kasm-user
    shm_size: 512mb
    restart: unless-stopped
    labels:
      - traefik.http.routers.https-0-cb8maubp3o7osivvwyewzair-chrome-5548.middlewares=gzip@file,authelia@file
      - traefik.http.services.https-0-cb8maubp3o7osivvwyewzair-chrome-5548.loadbalancer.server.scheme=https
      - traefik.http.services.http-0-cb8maubp3o7osivvwyewzair-chrome-5548.loadbalancer.server.scheme=https
volumes:
  kasm-profile:
