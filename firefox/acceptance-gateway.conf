# The public HTTPS route is terminated by Coolify. Only this gateway is routed.
# The browser has its own KasmVNC login. The driver requires X-API-Key.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8081;
    server_name _;
    client_max_body_size 1m;
    # Do not publish the driver's WS, internal fixtures or internal health path.
    location = /agent-driver/v1 {
        return 404;
    }
    location ^~ /agent-driver/v1/ {
        proxy_pass http://driver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }
    location / {
        proxy_pass https://firefox:6901;
        # KasmVNC uses its local self-signed TLS certificate on this private link.
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
